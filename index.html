<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Calculator</title>
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <div id="content">
            <h1>Calculator</h1>
            <p>A basic calculator for your computing needs</p>
        </div>

        <div id="calculatorContainer">
            <div id="displayContainer"></div>
            <div id="buttonContainer">
                <div id="digitButtonContainer">
                    <button type="button" class="digitButton" data-digit="0">
                        0
                    </button>
                    <button type="button" class="digitButton" data-digit="1">
                        1
                    </button>
                    <button type="button" class="digitButton" data-digit="2">
                        2
                    </button>
                    <button type="button" class="digitButton" data-digit="3">
                        3
                    </button>
                    <button type="button" class="digitButton" data-digit="4">
                        4
                    </button>
                    <button type="button" class="digitButton" data-digit="5">
                        5
                    </button>
                    <button type="button" class="digitButton" data-digit="6">
                        6
                    </button>
                    <button type="button" class="digitButton" data-digit="7">
                        7
                    </button>
                    <button type="button" class="digitButton" data-digit="8">
                        8
                    </button>
                    <button type="button" class="digitButton" data-digit="9">
                        9
                    </button>
                </div>
                <div id="operatorButtonContainer">
                    <button
                        type="button"
                        class="operatorButton"
                        data-operator="+"
                    >
                        +
                    </button>
                    <button
                        type="button"
                        class="operatorButton"
                        data-operator="-"
                    >
                        -
                    </button>
                    <button
                        type="button"
                        class="operatorButton"
                        data-operator="/"
                    >
                        /
                    </button>
                    <button
                        type="button"
                        class="operatorButton"
                        data-operator="*"
                    >
                        *
                    </button>
                </div>
                <div id="miscButtonContainer">
                    <button type="button" id="equalsButton">=</button>
                    <button type="button" id="clearButton">Clear</button>
                </div>
            </div>
        </div>
    </body>
    <script src="script.js"></script>
</html>
